name: Daily Databricks Digest

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC every day
  workflow_dispatch:       # allow manual trigger from GitHub Actions UI

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger digest API
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -L \
            -X POST "${{ secrets.VERCEL_APP_URL }}/api/digest" \
            -H "Authorization: Bearer ${{ secrets.DIGEST_SECRET }}")
          echo "HTTP status: $status"
          if [ "$status" != "200" ]; then
            echo "Digest job failed with status $status"
            exit 1
          fi

  # GitHub disables scheduled workflows after 60 days of repo inactivity.
  # Re-enabling the workflow via the API resets that timer.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep scheduled workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable "${{ github.workflow }}" --repo "${{ github.repository }}"
